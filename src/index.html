<!DOCTYPE html>
<html lang="en" class="transition">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <link rel="stylesheet" href="assets/stylesheet/output.css">
  <link rel="stylesheet" href="assets/stylesheet/master.css">
</head>

<body class="bg-gradient-to-br from-gray-200 to-gray-950 flex flex-col md:flex-row items-center justify-center min-h-screen gap-6">

  <div class="w-80 bg-gray-500 rounded-3xl shadow-3xl p-4">

    <!-- /////header//////// -->
    <div class="flex justify-between items-center mb-3 border-b border-gray-700 pb-2">
      <span id="date" class="text-sm text-gray-200"></span>
    </div>

    <!-- ///////display//////////// -->
    <div class="bg-gray-200 rounded-xl p-3 mb-4">
      <input id="inp" type="text"
        class="w-full text-right text-lg bg-transparent outline-none text-gray-800"
        placeholder="0"
        readonly>

      <div id="result" class="text-right text-zinc-950 mt-2 text-xl"></div>
    </div>

    <!-- ///////buttons///////////// -->
    <div class="grid grid-cols-4 gap-3 text-lg">

      <button class="btn">/</button>
      <button class="btn">(</button>
      <button class="btn">)</button>
      <button class="btn">C</button>

      <button class="btn">*</button>
      <button class="btn">7</button>
      <button class="btn">8</button>
      <button class="btn">9</button>

      <button class="btn">-</button>
      <button class="btn">4</button>
      <button class="btn">5</button>
      <button class="btn">6</button>

      <button class="btn">+</button>
      <button class="btn">1</button>
      <button class="btn">2</button>
      <button class="btn">3</button>

      <button class="btn">=</button>
      <button class="btn">0</button>
      <button class="btn">.</button>
      <button class="btn">DEL</button>

    </div>
    
  </div>
  <!-- ////////////////footer//////////////// -->
  <div class="footer-container w-[165] px-10 gap-20">
    <div class="flex flex-col items-end gap-3">
      <div class="flex items-center justify-center gap-4">
          <div>
              <h3 class="text-white text-xl font-bold">Yasaman Mirzaei</h3>
              <p class="text-gray-800 text-sm">Front-end Developer</p>
          </div>
          <div class="w-35 h-35 rounded-full border-2 border-gray-600 overflow-hidden shadow-xl">
              <img src="assets/img/yasi.jpg" alt="Profile" class="w-full h-full object-cover">
          </div>
      </div>
        <div class="flex gap-5 items-center justify-between">
          <span class="text-gray-800 font-medium">Connect with me:</span>
          <div class="flex gap-4">
            <a href="https://www.linkedin.com/in/yasaman-mirzaei-b9499537b" class="social-link group" target="_blank">
                <div class="w-10 h-10 bg-zinc-600 rounded-xl flex justify-center items-center group-hover:bg-gray-600 transition-all duration-300">
                    <img src="https://cdn-icons-png.flaticon.com/512/174/174857.png" class="w-5 invert opacity-70 group-hover:opacity-100" alt="LinkedIn">
                </div>
            </a>
            <a href="https://github.com/yasamanmrz" class="social-link group" target="_blank">
                <div class="w-10 h-10 bg-zinc-600 rounded-xl flex justify-center items-center group-hover:bg-gray-600 transition-all duration-300">
                    <img src="https://cdn-icons-png.flaticon.com/512/25/25231.png" class="w-5 invert opacity-70 group-hover:opacity-100" alt="GitHub">
                </div>
            </a>
            <a href="https://www.instagram.com/yasaman_dev?igsh=MWZkMGNmazlidTV3cQ==" class="social-link group" target="_blank">
                <div class="w-10 h-10 bg-zinc-600 rounded-xl flex justify-center items-center group-hover:bg-gray-600 transition-all duration-300">
                    <img src="https://cdn-icons-png.flaticon.com/512/174/174855.png" class="w-5 invert opacity-70 group-hover:opacity-100" alt="Instagram">
                </div>
            </a>
          </div>
        </div>
    </div>
    
  </div>

  <script src="assets/js/master.js"></script>
</body>
</html>
